name: Build LEKEMA APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform & sync web assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node -e '
            const fs = require("fs");
            const path = require("path");
            const logoSrc = "www/file_00000000227881f48510b7ce45188ed5.png";
            const resDir = "android/app/src/main/res";
            if (fs.existsSync(logoSrc) && fs.existsSync(resDir)) {
              const logoBytes = fs.readFileSync(logoSrc);
              const dirs = fs.readdirSync(resDir).filter(d => d.startsWith("mipmap"));
              for (const d of dirs) {
                const fullDir = path.join(resDir, d);
                const files = fs.readdirSync(fullDir);
                for (const f of files) {
                  if (f.startsWith("ic_launcher") && (f.endsWith(".png") || f.endsWith(".webp"))) {
                    const outFile = path.join(fullDir, f.replace(/\.webp$/, ".png"));
                    if (f.endsWith(".webp")) {
                      fs.unlinkSync(path.join(fullDir, f));
                    }
                    fs.writeFileSync(outFile, logoBytes);
                  }
                }
              }
            }
          '
          npx cap sync android
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let xml = fs.readFileSync(manifestPath, "utf8");
              const perms = [
                "<uses-permission android:name=\"android.permission.CAMERA\" />",
                "<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />",
                "<uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />"
              ].join("\n    ");
              if (!xml.includes("android.permission.CAMERA")) {
                xml = xml.replace(
                  /<application(\s|>)/,
                  perms + "\n\n    <application$1"
                );
                fs.writeFileSync(manifestPath, xml, "utf8");
              }
            }
          '

      - name: Build Debug APK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lekema-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
