name: Build LEKEMA APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform & sync web assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node -e '
            const fs = require("fs");
            const path = require("path");
            const logoSrc = "www/file_00000000227881f48510b7ce45188ed5.png";
            const resDir = "android/app/src/main/res";
            if (fs.existsSync(logoSrc) && fs.existsSync(resDir)) {
              const logoBytes = fs.readFileSync(logoSrc);
              const dirs = fs.readdirSync(resDir).filter(d => d.startsWith("mipmap"));
              for (const d of dirs) {
                const fullDir = path.join(resDir, d);
                const files = fs.readdirSync(fullDir);
                for (const f of files) {
                  if (f.startsWith("ic_launcher") && (f.endsWith(".png") || f.endsWith(".webp"))) {
                    const outFile = path.join(fullDir, f.replace(/\.webp$/, ".png"));
                    if (f.endsWith(".webp")) {
                      fs.unlinkSync(path.join(fullDir, f));
                    }
                    fs.writeFileSync(outFile, logoBytes);
                  }
                }
              }
            }
          '
          npx cap sync android
          node -e '
            const fs = require("fs");
            const path = require("path");

            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let xml = fs.readFileSync(manifestPath, "utf8");
              const perms = [
                "<uses-permission android:name=\"android.permission.CAMERA\" />",
                "<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />",
                "<uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />"
              ].join("\n    ");
              if (!xml.includes("android.permission.CAMERA")) {
                xml = xml.replace(
                  /<application(\s|>)/,
                  perms + "\n\n    <application$1"
                );
                fs.writeFileSync(manifestPath, xml, "utf8");
              }
            }

            function findMainActivity(dir) {
              if (!fs.existsSync(dir)) return null;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  const found = findMainActivity(full);
                  if (found) return found;
                } else if (entry.name === "MainActivity.java" || entry.name === "MainActivity.kt") {
                  return full;
                }
              }
              return null;
            }

            const mainActPath = findMainActivity("android/app/src/main/java");
            if (mainActPath && mainActPath.endsWith(".java")) {
              let javaCode = fs.readFileSync(mainActPath, "utf8");
              if (!javaCode.includes("handleAndroidBackButton")) {
                if (!javaCode.includes("import android.webkit.ValueCallback;")) {
                  javaCode = javaCode.replace(
                    /(package\s+[\w.]+;\s*)/,
                    "$1\nimport android.webkit.ValueCallback;\n"
                  );
                }
                javaCode = javaCode.replace(
                  /(public class MainActivity extends BridgeActivity\s*\{)/,
                  `$1
    @Override
    @SuppressWarnings("deprecation")
    public void onBackPressed() {
        final MainActivity self = this;
        runOnUiThread(new Runnable() {
            @Override
            public void run() {
                if (self.bridge != null && self.bridge.getWebView() != null) {
                    self.bridge.getWebView().evaluateJavascript(
                        "(function(){ return (typeof window.handleAndroidBackButton === '\''function'\'' && window.handleAndroidBackButton()) ? '\''HANDLED'\'' : '\''EXIT'\''; })();",
                        new ValueCallback<String>() {
                            @Override
                            public void onReceiveValue(String value) {
                                if (value == null || !value.contains("HANDLED")) {
                                    self.finish();
                                }
                            }
                        }
                    );
                } else {
                    self.finish();
                }
            }
        });
    }
`
                );
                fs.writeFileSync(mainActPath, javaCode, "utf8");
              }
            }
          '

      - name: Build Debug APK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lekema-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
