name: Build LEKEMA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform & sync web assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply custom launcher icon
        run: |
          LOGO="www/file_00000000227881f48510b7ce45188ed5.png"
          RES="android/app/src/main/res"
          if [ -f "$LOGO" ] && [ -d "$RES" ]; then
            for dir in "$RES"/mipmap-*; do
              if [ -d "$dir" ]; then
                for f in "$dir"/ic_launcher*.png "$dir"/ic_launcher*.webp; do
                  if [ -f "$f" ]; then
                    cp "$LOGO" "$f"
                  fi
                done
              fi
            done
          fi

      - name: Configure Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n\n    <application/' "$MANIFEST"
          fi

      - name: Patch MainActivity for in-app back navigation
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            function findMainActivity(dir) {
              if (!fs.existsSync(dir)) return null;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  const found = findMainActivity(full);
                  if (found) return found;
                } else if (entry.name === "MainActivity.java") {
                  return full;
                }
              }
              return null;
            }

            const mainJava = findMainActivity("android/app/src/main/java");
            if (mainJava) {
              let code = fs.readFileSync(mainJava, "utf8");
              if (!code.includes("handleAndroidBackButton")) {
                if (!code.includes("import android.webkit.ValueCallback;")) {
                  code = code.replace(
                    /(package\s+[\w.]+;\s*)/,
                    "$1\nimport android.webkit.ValueCallback;\n"
                  );
                }
                const backMethod = [
                  "",
                  "    @Override",
                  "    @SuppressWarnings(\"deprecation\")",
                  "    public void onBackPressed() {",
                  "        final MainActivity self = this;",
                  "        if (self.bridge != null && self.bridge.getWebView() != null) {",
                  "            self.bridge.getWebView().evaluateJavascript(",
                  "                \"(function(){ try { return (typeof window.handleAndroidBackButton === '\''function'\'' && window.handleAndroidBackButton()) ? '\''HANDLED'\'' : '\''EXIT'\''; } catch(e) { return '\''EXIT'\''; } })();\",",
                  "                new ValueCallback<String>() {",
                  "                    @Override",
                  "                    public void onReceiveValue(String value) {",
                  "                        if (value == null || !value.contains(\"HANDLED\")) {",
                  "                            self.finish();",
                  "                        }",
                  "                    }",
                  "                }",
                  "            );",
                  "        } else {",
                  "            self.finish();",
                  "        }",
                  "    }",
                  ""
                ].join("\n");

                code = code.replace(
                  /(public\s+class\s+MainActivity\s+extends\s+BridgeActivity\s*\{)/,
                  "$1" + backMethod
                );
                fs.writeFileSync(mainJava, code, "utf8");
              }
            }
          '

      - name: Build Debug APK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lekema-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
